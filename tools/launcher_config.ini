[GAME]
# Modo de arranque del juego anfitrión: "steam" o "custom" (versión pirata / no-Steam / ejecutable directo)
mode = steam

# ID de Steam para Dead Rising 3 (265550)
steam_app_id = 265550

# Ruta completa hacia deadrising3.exe (solo requerida si mode = custom o si Steam no está instalado)
# Ejemplo: C:\Games\Dead Rising 3\deadrising3.exe
custom_game_path = 

# Si custom_game_path está vacío, buscar automáticamente en discos C:, D:, E:
auto_detect_exe = true

[MINECRAFT]
# Ruta al ejecutable de PrismLauncher (dejar en "auto" para detección automática en Windows)
prismlauncher_path = auto

# Nombre del perfil o instancia en PrismLauncher con el mod Fabric instalado
instance_name = DeadRising3_Crossover

# Nombre del mundo local que cargará automáticamente sin pasar por los menús
world_name = Void

# Ocultar la ventana de GLFW en Windows (100% Invisible / Renderizado en FBO Off-Screen)
headless = true

[MONITORING]
# Umbral mínimo de RAM (en Megabytes) para considerar que deadrising3.exe superó la pantalla de carga
min_ram_mb = 500

# Tiempo máximo de espera en segundos antes de timeout
timeout_seconds = 180

# Desplegar automáticamente DR3Hook.asi como dinput8.dll en la carpeta del juego para inyección silenciosa
auto_deploy_proxy = true
